<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Pedidos feitos | DonnaBella</title><link rel="stylesheet" href="assets/style.css"></head><body><header class="site-header"><div class="header-row"><a class="icon-btn" href="index.html">←</a><a class="logo" href="index.html">Donna<span>Bella</span></a><a class="bag-btn" href="index.html#colecoes">Comprar</a></div></header><main><section class="wrap section-pad"><p class="eyebrow">Minha DonnaBella</p><h1 style="font-size:clamp(44px,7vw,78px)">Pedidos feitos</h1><div id="ordersPage" style="margin-top:35px"></div></section></main><script>const o=JSON.parse(localStorage.getItem('db_orders')||'[]');const el=document.getElementById('ordersPage');el.innerHTML=o.length?o.map(x=>`<div class="order-card"><b>${x.id}</b><span>${x.date}</span><span>${x.status}</span><strong>${Number(x.total).toLocaleString('pt-BR',{style:'currency',currency:'BRL'})}</strong></div>`).join(''):`<div class="review-empty"><div class="empty-mark">Donna</div><h3>Nenhum pedido encontrado.</h3><p>Seus pedidos registrados neste navegador aparecerão aqui.</p><a class="btn btn-dark" href="index.html#colecoes">Fazer pedido agora</a></div>`;</script></body></html>
